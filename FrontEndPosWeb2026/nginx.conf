server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/pos-web.crt;
    ssl_certificate_key /etc/nginx/certs/pos-web.key;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets con hash de Vite: cacheables indefinidamente
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Nunca cachear el shell/SW para evitar servir una versión vieja del PWA
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SSE de notificaciones: sin buffering, si no los eventos quedan atascados en Nginx
    location ^~ /api/stream {
        proxy_pass http://backend-api:8080/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 3600s;
    }

    # Reverse proxy hacia el backend, mismo origen que en dev (proxy de Vite)
    location /api/ {
        proxy_pass http://backend-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend-api:8080/uploads/;
        proxy_set_header Host $host;
    }

    # Fallback SPA para las rutas de React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
