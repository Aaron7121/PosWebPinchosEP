# ==========================================
# 1. Configuraci�n de Base de Datos (PostgreSQL)
# ==========================================
quarkus.datasource.db-kind=postgresql
# Cambia localhost, el puerto y el nombre de la BD seg�n tu entorno
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/dbposweb
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# ==========================================
# 2. Configuraci�n de Hibernate ORM (Panache)
# ==========================================
# Desactivamos la creaci�n autom�tica de tablas de Hibernate porque usaremos Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true
# Zona fija para leer/escribir columnas timestamp (caja.fecha_apertura/fecha_cierre son 'timestamp without time zone')
quarkus.hibernate-orm.jdbc.time-zone=America/Bogota

# Escucha en todas las interfaces para que los dispositivos de la red local puedan acceder
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# ==========================================
# 3. Configuraci�n de Flyway
# ==========================================
# Ejecuta las migraciones autom�ticamente al iniciar la app
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=1 

# ==========================================
# 4. Configuraci�n de JWT (SmallRye JWT)
# ==========================================
# Emisor estable del token: etiqueta local, no depende de la IP del servidor
mp.jwt.verify.issuer=pos-server-local
mp.jwt.verify.publickey.location=jwt/publicKey.pem
smallrye.jwt.sign.key.location=jwt/privateKey.pem
smallrye.jwt.new-token.issuer=pos-server-local
# Duracion del token en segundos (7 dias)
smallrye.jwt.new-token.lifespan=604800

# ==========================================
# 5. Pol�tica de permisos HTTP (defensa por defecto)
# ==========================================
# Por seguridad, todo /api/* exige token, EXCEPTO login.
# Las rutas permitidas se declaran primero; el resto queda protegido.
quarkus.http.auth.permission.permit-login.paths=/api/auth/login,/api/test,/api/stream
quarkus.http.auth.permission.permit-login.policy=permit
# Imagenes subidas: acceso publico (un <img> no envia header de auth)
quarkus.http.auth.permission.permit-uploads.paths=/uploads/*
quarkus.http.auth.permission.permit-uploads.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

# ==========================================
# 6. Subida de imagenes
# ==========================================
# Carpeta base donde se guardan los archivos subidos
pos.upload.dir=uploads
# Limite maximo del body de las peticiones
quarkus.http.limits.max-body-size=10M
# Cada parte multipart tambien respeta un limite propio (por defecto 2048 bytes)
quarkus.http.limits.max-form-attribute-size=10M

# ==========================================
# 7. CORS (solo necesario para acceso directo cross-origin)
# ==========================================
# Con el proxy de Vite o el frontend embebido no se necesita.
# Se activa permitiendo el origin del frontend en desarrollo.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
