version: '3.8'

services:
  postgres-db:
    image: postgres:17-alpine # Debe coincidir con la versión usada por pg_dump en init-db/dbposweb2026.sql
    container_name: mi-postgres-pos
    restart: unless-stopped # Si la PC se reinicia, la base se enciende sola
    env_file:
      - .env # Lee las contraseñas de tu archivo secreto
    ports:
      - "${DB_PORT}:5432" # Mapea el 5433 de tu PC al 5432 del contenedor
    volumes:
      # Guarda los datos reales en tu disco duro para que no se borren si apagas Docker
      - pos-data:/var/lib/postgresql/data 
      # Inyecta tu archivo SQL para que se ejecute la primera vez
      - ./init-db:/docker-entrypoint-initdb.d 

# 2. NUESTRO BACKEND JAVA
  backend-api:
    build: 
      context: ./BackedPosWeb2026 # Le dice a Docker que busque el Dockerfile en esa carpeta
    container_name: mi-java-pos
    restart: unless-stopped
    depends_on:
      - postgres-db # Espera a que la BD encienda primero
    ports:
      - "8080:8080" # Exponemos el 8080 a tu PC
    environment:
      # AQUÍ ESTÁ LA MAGIA: Sobreescribimos el application.properties de Quarkus.
      # Nota que en la URL no dice "localhost", dice "postgres-db" (el nombre del contenedor de arriba)
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

# 3. NUESTRO FRONTEND (React + Nginx)
  frontend-web:
    build:
      context: ./FrontEndPosWeb2026 # Nginx sirve el build y proxya /api y /uploads al backend-api
    container_name: mi-frontend-pos
    restart: unless-stopped
    depends_on:
      - backend-api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./FrontEndPosWeb2026/certs:/etc/nginx/certs:ro

volumes:
  pos-data: